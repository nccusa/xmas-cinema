<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>現場報到｜聖誕露天電影院</title>
<meta name="theme-color" content="#0F1B17">
<link rel="manifest" href="scan.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場報到">
<link rel="apple-touch-icon" href="icons/scan-apple-180.png">
<link rel="icon" href="icons/scan-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --night:#0F1B17; --deck:#17261F; --deck2:#1F3229; --rule:rgba(242,239,229,.12); --cream:#F2EFE5; --dim:#A9B5AE;
  --gold:#E2BA5C; --ok:#0B7A4F; --okd:#075C3B; --warn:#E8A317; --warnink:#241800; --bad:#C21A22; --badd:#8E1218;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --num:"Inter","Noto Sans TC",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.i{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- 登入與站別 ---------- */
.gate{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));max-width:480px;margin:0 auto}
.gate .mark{width:56px;height:56px;border-radius:14px;margin-bottom:20px}
.gate h1{font-size:28px;font-weight:900;margin:0 0 6px;line-height:1.25}
.gate p.sub{color:var(--dim);margin:0 0 28px}
.fld{display:block;margin-bottom:16px}
.fld span{display:block;font-size:14px;color:var(--dim);margin-bottom:6px}
.fld input{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--deck);color:var(--cream);font:inherit;font-size:17px}
.fld input:focus{border-color:var(--gold);outline:none}
.remember{display:flex;gap:10px;align-items:center;margin:4px 0 20px;color:var(--dim);font-size:15px}
.remember input{width:20px;height:20px;accent-color:var(--gold)}
.err{color:#FF9C95;min-height:22px;font-size:15px;margin-bottom:8px}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--cream);color:var(--night);font-weight:900;font-size:18px;cursor:pointer;transition:transform .12s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.55}
.stations{display:grid;gap:10px;margin-top:4px}
.stn{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--rule);background:var(--deck);cursor:pointer;transition:border-color .15s,transform .12s}
.stn:hover{border-color:var(--gold)}
.stn:active{transform:scale(.985)}
.stn .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--deck2);color:var(--gold)}
.stn .ic .i{width:26px;height:26px}
.stn b{display:block;font-size:18px}
.stn small{display:block;color:var(--dim);font-size:14px}
.stn .i.chev{color:var(--dim)}

/* ---------- 主畫面 ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--night)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--deck);font-weight:700;font-size:16px;cursor:pointer;max-width:70vw}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .i{color:var(--gold)}
.grow{flex:1}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 3px rgba(61,220,151,.18)}
.net.off::before{background:#FF6B60;box-shadow:0 0 0 3px rgba(255,107,96,.2)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--deck);display:grid;place-items:center;cursor:pointer}
.iconbtn.on{color:var(--gold);border-color:rgba(226,186,92,.5)}

.stage{display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px;padding:0 14px;min-height:0}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:16/10;max-height:34vh;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18% 14%;pointer-events:none}
.cam .frame i{position:absolute;width:26px;height:26px;border-color:var(--cream);border-style:solid;opacity:.9}
.cam .frame i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px;border-top-left-radius:8px}
.cam .frame i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0;border-top-right-radius:8px}
.cam .frame i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px;border-bottom-left-radius:8px}
.cam .frame i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0;border-bottom-right-radius:8px}
.cam .sweep{position:absolute;left:6%;right:6%;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);top:50%;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.cam.paused .sweep{animation-play-state:paused;opacity:.3}
.cam .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:rgba(15,27,23,.86);color:var(--dim);font-size:15px}
.cam .msg .i{width:28px;height:28px}
.cam .pill{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(15,27,23,.72);font-size:12.5px;color:var(--cream)}
.cam .torch{position:absolute;right:10px;bottom:10px}

/* 結果面板：整塊換色 */
.panel{position:relative;border-radius:20px;background:var(--deck);padding:18px 18px 20px;overflow:auto;min-height:0;transition:background-color .18s}
.panel.ok{background:var(--ok)}
.panel.done{background:var(--okd)}
.panel.warn{background:var(--warn);color:var(--warnink)}
.panel.bad{background:var(--bad)}
.panel.flash{animation:pop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{0%{transform:scale(.97)}100%{transform:scale(1)}}
.state{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(26px,7vw,40px);line-height:1.15;letter-spacing:.01em}
.state .i{width:1.05em;height:1.05em}
.who{font-size:clamp(28px,8vw,46px);font-weight:900;line-height:1.15;margin:12px 0 2px;word-break:break-all}
.meta{font-size:15px;opacity:.85;display:flex;flex-wrap:wrap;gap:4px 14px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;background:rgba(0,0,0,.22);vertical-align:middle;margin-left:8px}
.warn .tag{background:rgba(0,0,0,.12)}
.food{margin-top:16px;border-top:1px solid rgba(255,255,255,.22)}
.warn .food{border-color:rgba(36,24,0,.25)}
.food h4{margin:14px 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;opacity:.9}
.food h4 .got{font-weight:500;font-size:13px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.2)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;font-size:clamp(20px,5.4vw,26px);font-weight:700;border-bottom:1px dashed rgba(255,255,255,.22)}
.warn .line{border-color:rgba(36,24,0,.2)}
.line b{font-family:var(--num);font-size:1.15em}
.line.dim{opacity:.4}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);font-size:16px;line-height:1.45}
.warn .hint{background:rgba(36,24,0,.1)}
.hint .i{margin-top:2px}
.idcheck{margin-top:12px;font-size:14px;opacity:.85;display:flex;gap:8px;align-items:center}

/* 待機畫面 */
.idle .state{font-size:clamp(24px,6.4vw,34px)}
.idle p{color:var(--dim);margin:8px 0 0}
.recent{margin-top:18px}
.recent h4{font-size:13px;color:var(--dim);font-weight:500;margin:0 0 6px}
.recent li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.recent ul{list-style:none;margin:0;padding:0}
.recent .t{font-family:var(--num);color:var(--dim);font-size:13px;min-width:42px}
.recent .d{width:8px;height:8px;border-radius:50%;flex:none}
.d.ok{background:#3DDC97}.d.warn{background:var(--warn)}.d.bad{background:#FF6B60}
.install{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:14px;border:1px dashed rgba(226,186,92,.5);color:var(--cream);background:transparent;width:100%;text-align:left;cursor:pointer}
.install .i{color:var(--gold);width:24px;height:24px}
.install small{display:block;color:var(--dim)}

/* 倒數條 */
.countdown{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.55);width:100%;transform-origin:left;animation:cd linear forwards}
@keyframes cd{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* 底部動作區（大拇指範圍） */
.dock{padding:12px 14px calc(12px + var(--safe-b));display:grid;grid-template-columns:auto 1fr;gap:10px;background:linear-gradient(to top,var(--night) 70%,rgba(15,27,23,0))}
.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:0;border-radius:16px;background:var(--cream);color:var(--night);font-weight:900;font-size:20px;cursor:pointer;transition:transform .12s,opacity .15s}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.35;cursor:not-allowed}
.go .i{width:26px;height:26px}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:0 18px;border-radius:16px;border:1px solid var(--rule);background:var(--deck);font-weight:700;cursor:pointer}

/* 底部抽屜 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--deck);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + var(--safe-b));max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--rule);margin:2px auto 12px}
.sheet h3{margin:0 0 12px;font-size:20px}
.search{display:flex;gap:8px}
.search input{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--rule);background:var(--night);color:var(--cream);padding:0 14px;font:inherit;font-size:17px}
.search button{min-width:56px;border:0;border-radius:12px;background:var(--cream);color:var(--night);display:grid;place-items:center;cursor:pointer}
.res{list-style:none;margin:12px 0 0;padding:0}
.res button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--night);margin-bottom:8px;cursor:pointer}
.res b{font-size:17px}
.res small{color:var(--dim);grid-column:1}
.res .st{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--deck2)}
.menu li{list-style:none}
.menu{margin:0;padding:0}
.menu button,.menu label{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 4px;border:0;background:none;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer;font-size:17px}
.menu .i{color:var(--gold);width:22px;height:22px}
.menu .sw{margin-left:auto;width:46px;height:28px;border-radius:99px;background:var(--deck2);position:relative;transition:background .15s;flex:none}
.menu .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.menu input{display:none}
.menu input:checked + .sw{background:var(--ok)}
.menu input:checked + .sw::after{transform:translateX(18px);background:var(--cream)}
.steps{margin:0;padding-left:22px;line-height:1.9}
.steps .i{color:var(--gold)}

@media (min-width:900px) and (orientation:landscape){
  .stage{grid-template-columns:minmax(320px,42%) 1fr;grid-template-rows:minmax(0,1fr);align-items:start}
  .cam{aspect-ratio:4/3;max-height:none}
  .panel{height:100%}
  .dock{grid-row:3}
}
</style>
</head>
<body>

<!-- 登入 -->
<section id="loginView" class="gate hidden" aria-labelledby="lt">
  <img class="mark" src="icons/scan-192.png" alt="">
  <h1 id="lt">現場報到</h1>
  <p class="sub">聖誕露天電影院・工作人員登入</p>
  <form id="loginForm">
    <label class="fld"><span>Email</span><input type="email" id="lEmail" autocomplete="username" required></label>
    <label class="fld"><span>密碼</span><input type="password" id="lPass" autocomplete="current-password" required></label>
    <label class="remember"><input type="checkbox" id="lRemember" checked>記住這台裝置（關掉 App 也不用重新登入）</label>
    <div class="err" id="lErr" role="alert"></div>
    <button class="primary" type="submit" id="lBtn">登入</button>
  </form>
</section>

<!-- 選站別 -->
<section id="stationView" class="gate hidden" aria-labelledby="st">
  <h1 id="st">這台裝置負責哪一站？</h1>
  <p class="sub">選一次就會記住。之後要換，點左上角的站別。</p>
  <div class="stations" id="stationList"></div>
</section>

<!-- 主畫面 -->
<div id="app" class="app hidden">
  <header class="bar">
    <button class="chip" id="stBtn" type="button" aria-label="切換站別">站別</button>
    <span class="grow"></span>
    <span class="net" id="net">連線中</span>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="設定" data-icon="menu"></button>
  </header>

  <div class="stage">
    <div class="cam" id="cam">
      <video id="video" playsinline muted></video>
      <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="sweep" aria-hidden="true"></div>
      <span class="pill"><span data-icon="scan-barcode"></span>條碼槍也可以直接掃</span>
      <button class="iconbtn torch hidden" id="torchBtn" type="button" aria-label="手電筒" data-icon="flashlight"></button>
      <div class="msg hidden" id="camMsg"></div>
    </div>
    <section class="panel idle" id="panel" aria-live="assertive" tabindex="-1"></section>
  </div>

  <div class="dock">
    <button class="ghost" id="findBtn" type="button"><span data-icon="search"></span>查詢</button>
    <button class="go" id="goBtn" type="button" disabled>請掃描學生證或 QR Code</button>
  </div>
</div>

<!-- 查詢抽屜 -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="findSheet" aria-labelledby="ft" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="ft">手動查詢</h3>
  <form class="search" id="searchForm">
    <input id="q" placeholder="姓名、手機、學號或訂單編號" autocomplete="off" enterkeyhint="search">
    <button type="submit" aria-label="查詢" data-icon="search"></button>
  </form>
  <ul class="res" id="results"></ul>
</section>

<!-- 設定抽屜 -->
<section class="sheet" id="menuSheet" aria-labelledby="mt" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="mt">設定</h3>
  <ul class="menu">
    <li><label><span data-icon="camera"></span>鏡頭掃描<input type="checkbox" id="optCam" checked><span class="sw"></span></label></li>
    <li><label><span data-icon="volume-2"></span>提示音<input type="checkbox" id="optSound" checked><span class="sw"></span></label></li>
    <li><label><span data-icon="smartphone"></span>震動<input type="checkbox" id="optVibe" checked><span class="sw"></span></label></li>
    <li><button type="button" id="mStation"><span data-icon="repeat"></span>切換站別</button></li>
    <li><button type="button" id="mInstall"><span data-icon="square-plus"></span>加到主畫面</button></li>
    <li><button type="button" id="mOut"><span data-icon="log-out"></span>登出</button></li>
  </ul>
</section>

<!-- iPhone 加到主畫面教學 -->
<section class="sheet" id="iosSheet" aria-labelledby="it" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="it">加到主畫面</h3>
  <ol class="steps">
    <li>用 <b>Safari</b> 打開這一頁</li>
    <li>點下方的 <span data-icon="share"></span> <b>分享</b></li>
    <li>往下滑，點 <span data-icon="square-plus"></span> <b>加入主畫面</b></li>
    <li>按右上角的 <b>新增</b></li>
  </ol>
  <p style="color:var(--dim)">之後從主畫面的「現場報到」打開，就是全螢幕，也會記住登入和站別。</p>
  <button class="primary" type="button" id="iosOk">知道了</button>
</section>

<script src="assets/icons.js"></script>
<script src="assets/api.js"></script>
<script>
(function(){
  Api.storeKey = 'xc_staff_session';
  registerSW(); hydrateIcons();
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const pref = k => { try { return localStorage.getItem('xc_opt_' + k) !== '0'; } catch (e) { return true; } };
  const setPref = (k, v) => { try { localStorage.setItem('xc_opt_' + k, v ? '1' : '0'); } catch (e) {} };
  let station = null, current = null, busy = false, lastCode = '', lastAt = 0, resetTimer = null;
  let stream = null, zx = null, detector = null, scanTimer = null, track = null, torchOn = false, wakeLock = null;
  let recent = []; try { recent = JSON.parse(localStorage.getItem('xc_recent') || '[]'); } catch (e) {}

  // ---------- 聲音與震動（綠：清脆兩聲；橘：中音兩聲；紅：低音長響） ----------
  let actx = null;
  function feedback(tone){
    if ($('optVibe').checked && navigator.vibrate) navigator.vibrate(tone === 'ok' ? 60 : tone === 'warn' ? [70, 60, 70] : [220, 80, 220]);
    if (!$('optSound').checked) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const seq = tone === 'ok' ? [[880, .08], [1320, .12]] : tone === 'warn' ? [[660, .1], [660, .1]] : [[200, .45]];
      let t = actx.currentTime;
      seq.forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = tone === 'bad' ? 'square' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02); t += d + .06; });
    } catch (e) {}
  }

  // ---------- 登入 ----------
  async function boot(){
    Api.loadSession();
    if (!Api.session) return showLogin();
    try { const role = await Api.rpc('my_role'); if (!role) throw new Error('這個帳號沒有工作人員權限'); }
    catch (e) { if (/權限|登入|JWT/.test(e.message)) { await Api.logout(); return showLogin(e.message); } return showLogin('目前連不上伺服器，請確認網路後重試'); }
    $('loginView').classList.add('hidden');
    try { station = JSON.parse(localStorage.getItem('xc_station')); } catch (e) {}
    if (!station) return pickStation();
    openApp();
  }
  function showLogin(msg){ stopCamera(); $('app').classList.add('hidden'); $('stationView').classList.add('hidden'); $('loginView').classList.remove('hidden'); $('lErr').textContent = msg || ''; }
  $('loginForm').onsubmit = async e => {
    e.preventDefault(); $('lErr').textContent = ''; $('lBtn').disabled = true; $('lBtn').textContent = '登入中…';
    Api.remember = $('lRemember').checked;
    try { await Api.login($('lEmail').value.trim(), $('lPass').value); $('lPass').value = ''; await boot(); }
    catch (err) { $('lErr').textContent = /Invalid login/i.test(err.message) ? 'Email 或密碼不正確' : '登入失敗：' + err.message; }
    finally { $('lBtn').disabled = false; $('lBtn').textContent = '登入'; }
  };

  // ---------- 站別 ----------
  const ST_ICON = { checkin: 'user-check', pickup: 'hand-platter', both: 'badge-check' };
  async function pickStation(){
    stopCamera(); closeSheets(); $('app').classList.add('hidden'); $('stationView').classList.remove('hidden');
    let vendors = []; try { vendors = await Api.rpc('staff_vendors'); } catch (e) {}
    const opts = [{ mode: 'checkin', label: '報到站', desc: '確認付款、核對證件，不交付餐點' },
      { mode: 'pickup', vendor: null, label: '取餐站・全部店家', desc: '一次交付這個人所有的餐點' }]
      .concat(vendors.map(v => ({ mode: 'pickup', vendor: v, label: '取餐站・' + v, desc: '只交付這家店的餐點' })))
      .concat([{ mode: 'both', label: '單一櫃檯', desc: '報到和取餐在同一個位置，一次完成' }]);
    $('stationList').innerHTML = opts.map((o, i) => `<button class="stn" type="button" data-i="${i}"><span class="ic">${icon(o.vendor ? 'store' : ST_ICON[o.mode])}</span><span><b>${esc(o.label)}</b><small>${esc(o.desc)}</small></span>${icon('chevron-right', 'chev')}</button>`).join('');
    $('stationList').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; station = opts[+b.dataset.i]; try { localStorage.setItem('xc_station', JSON.stringify(station)); } catch (er) {} openApp(); };
  }
  const stName = () => station.mode === 'checkin' ? '報到站' : station.mode === 'pickup' ? (station.vendor ? '取餐・' + station.vendor : '取餐站・全部') : '單一櫃檯';
  function openApp(){
    $('stationView').classList.add('hidden'); $('app').classList.remove('hidden');
    $('stBtn').innerHTML = icon(station.vendor ? 'store' : ST_ICON[station.mode]) + `<span>${esc(stName())}</span>`;
    idle(); if ($('optCam').checked) startCamera(); keepAwake();
  }
  $('stBtn').onclick = pickStation; $('mStation').onclick = pickStation;

  // ---------- 鏡頭 ----------
  async function startCamera(){
    $('camMsg').classList.add('hidden'); $('cam').classList.remove('paused');
    try {
      const constraints = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
      if ('BarcodeDetector' in window) {
        const fmts = await BarcodeDetector.getSupportedFormats();
        detector = new BarcodeDetector({ formats: ['code_128','code_39','codabar','ean_13','itf','qr_code'].filter(f => fmts.includes(f)) });
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        $('video').srcObject = stream; await $('video').play();
        const loop = async () => { if (!stream) return; try { const codes = await detector.detect($('video')); if (codes.length) onCode(codes[0].rawValue, 'cam'); } catch (e) {} scanTimer = setTimeout(loop, 160); };
        loop();
      } else if (window.ZXing) {
        const hints = new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODABAR, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        zx = new ZXing.BrowserMultiFormatReader(hints, 180);
        await zx.decodeFromConstraints(constraints, $('video'), res => { if (res) onCode(res.getText(), 'cam'); });
        stream = $('video').srcObject;
      } else throw new Error('這個瀏覽器不支援鏡頭掃描');
      track = stream && stream.getVideoTracks()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      $('torchBtn').classList.toggle('hidden', !caps.torch);
    } catch (e) {
      camMsg('camera-off', /Permission|NotAllowed/i.test(e.name + e.message) ? '沒有相機權限。請在瀏覽器設定允許相機，或改用條碼槍、手動查詢。' : '鏡頭無法啟動（' + e.message + '），可以改用條碼槍或手動查詢。');
    }
  }
  function camMsg(ic, text){ $('camMsg').innerHTML = icon(ic) + `<span>${esc(text)}</span>`; $('camMsg').classList.remove('hidden'); $('cam').classList.add('paused'); }
  function stopCamera(){
    clearTimeout(scanTimer); torchOn = false; $('torchBtn').classList.remove('on');
    if (zx) { try { zx.reset(); } catch (e) {} zx = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    track = null;
  }
  $('torchBtn').onclick = async () => { if (!track) return; torchOn = !torchOn; try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { torchOn = false; } $('torchBtn').classList.toggle('on', torchOn); };
  async function keepAwake(){ try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopCamera(); return; }
    if (!$('app').classList.contains('hidden')) { if ($('optCam').checked) startCamera(); keepAwake(); }
  });

  // ---------- 條碼槍（鍵盤模擬，與鏡頭同時運作） ----------
  let buf = '', lastKey = 0;
  document.addEventListener('keydown', e => {
    if ($('app').classList.contains('hidden')) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const now = Date.now(); if (now - lastKey > 120) buf = ''; lastKey = now;
    if (e.key === 'Enter') { if (buf.length >= 6) { e.preventDefault(); onCode(buf, 'gun'); } buf = ''; return; }
    if (e.key.length === 1) buf += e.key;
  });

  // ---------- 畫面 ----------
  const P = () => $('panel');
  function setPanel(tone, html, countdown){
    clearTimeout(resetTimer);
    const p = P(); p.className = 'panel ' + tone; p.innerHTML = html;
    if (!reduce) { void p.offsetWidth; p.classList.add('flash'); }
    if (countdown) { p.insertAdjacentHTML('beforeend', `<div class="countdown" style="animation-duration:${countdown}ms"></div>`); resetTimer = setTimeout(idle, countdown); }
    p.scrollTop = 0;
  }
  function setGo(label, ic, enabled){ const g = $('goBtn'); g.innerHTML = (ic ? icon(ic) : '') + esc(label); g.disabled = !enabled; }
  function idle(){
    current = null;
    const prompt = station.mode === 'pickup' ? '請掃描學生證，交付餐點' : '請掃描學生證或報到 QR Code';
    setPanel('idle', `<div class="state">${icon('scan-line')}${esc(prompt)}</div>
      <p>校外人士請掃描他手機上的報到 QR Code；沒帶證件時按「查詢」用姓名或手機找。</p>
      ${!standalone ? `<button class="install" type="button" id="installHint">${icon('square-plus')}<span><b>加到主畫面</b><small>之後從桌面打開就是全螢幕，不用再找網址。</small></span></button>` : ''}
      ${recent.length ? `<div class="recent"><h4>這台裝置最近的紀錄</h4><ul>${recent.slice(0, 6).map(r => `<li><span class="t">${esc(r.t)}</span><span class="d ${r.tone}"></span><span>${esc(r.text)}</span></li>`).join('')}</ul></div>` : ''}`);
    P().classList.remove('flash');
    if ($('installHint')) $('installHint').onclick = install;
    setGo('等待掃描…', 'scan-line', false);
  }
  function log(tone, text){
    const t = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
    recent.unshift({ t, tone, text }); recent = recent.slice(0, 20);
    try { localStorage.setItem('xc_recent', JSON.stringify(recent)); } catch (e) {}
  }
  function head(r){
    return `<div class="who">${esc(r.name)}${r.participant_type === 'guest' ? `<span class="tag">${icon('globe')}校外</span>` : ''}${r.is_test ? `<span class="tag">${icon('flask-conical')}測試</span>` : ''}</div>
      <div class="meta"><span>${r.student_id ? '學號 <span class="num">' + esc(r.student_id) + '</span>' : '無學號'}</span><span>訂單 <span class="num">${esc(r.order_no)}</span></span><span>手機末三碼 <span class="num">${esc(r.phone_tail)}</span></span></div>`;
  }
  function itemsHtml(items, onlyVendor){
    if (!items || !items.length) return `<div class="hint">${icon('info')}<span>沒有點餐，只報名活動。</span></div>`;
    const by = {}; items.forEach(i => (by[i.vendor] = by[i.vendor] || []).push(i));
    return `<div class="food">` + Object.keys(by).map(v => {
      const dim = onlyVendor && v !== onlyVendor, got = by[v][0].picked_up_at;
      return `<h4${dim ? ' style="opacity:.45"' : ''}>${icon('store')}${esc(v)}${got ? `<span class="got">${esc(fmtTime(got).slice(-5))} 已取</span>` : ''}${dim ? '<span class="got">不是這一站</span>' : ''}</h4>`
        + by[v].map(i => `<div class="line${dim ? ' dim' : ''}"><span>${esc(i.name)}</span><b>× ${esc(i.qty)}</b></div>`).join('');
    }).join('') + `</div>`;
  }
  const note = r => r.internal_note ? `<div class="hint">${icon('sticky-note')}<span>${esc(r.internal_note)}</span></div>` : '';
  const idcheck = r => `<div class="idcheck">${icon('id-card')}${r.participant_type === 'guest' ? '校外人士：請口頭確認姓名和手機末三碼' : '請核對學生證照片是本人'}</div>`;
  const vendorsLeft = r => { const by = {}; (r.items || []).forEach(i => by[i.vendor] = i.picked_up_at); return Object.keys(by).filter(v => !by[v]); };

  function show(r){
    current = null;
    if (!r || !r.found) {
      setPanel('bad', `<div class="state">${icon('circle-x')}查無報名</div><div class="who" style="font-size:22px">${esc(r && r.reason || '找不到資料')}</div><div class="meta"><span>掃到：<span class="num">${esc(r && r.code || '')}</span></span></div><div class="hint">${icon('search')}<span>按「查詢」用姓名或手機再找一次；還是找不到，請他找管理員。</span></div>`);
      setGo('改用查詢', 'search', true); current = { _find: true }; feedback('bad'); log('bad', '查無：' + (r && r.code || '')); return;
    }
    if (r.status === 'pending_payment') {
      setPanel('warn', `<div class="state">${icon('hourglass')}還沒確認付款</div>${head(r)}<div class="hint">${icon('circle-dollar-sign')}<span>應付 <b class="num">${money(r.total_amount)}</b>，已收 <b class="num">${money(r.paid_amount)}</b>。請他找管理員確認，先不要報到或交餐。</span></div>${itemsHtml(r.items)}${note(r)}`);
      setGo('先不要放行', 'ban', false); feedback('warn'); log('warn', r.name + ' 未付款'); return;
    }
    if (r.status === 'cancelled') { setPanel('bad', `<div class="state">${icon('ban')}這筆報名已取消</div>${head(r)}${note(r)}`); setGo('不能放行', 'ban', false); feedback('bad'); log('bad', r.name + ' 已取消'); return; }
    const m = station.mode;
    if (m === 'checkin') {
      if (r.checked_in_at) { setPanel('warn', `<div class="state">${icon('triangle-alert')}已經報到過了</div>${head(r)}<div class="hint">${icon('clock')}<span>${esc(fmtTime(r.checked_in_at))} 已報到。同一個人重複出現時，請核對證件。</span></div>${note(r)}`); setGo('已報到過', 'check', false); feedback('warn'); log('warn', r.name + ' 重複報到'); return; }
      const n = (r.items || []).length;
      setPanel('ok', `<div class="state">${icon('circle-check')}可以報到</div>${head(r)}<div class="hint">${icon(n ? 'utensils-crossed' : 'info')}<span>${n ? '有預訂餐點，報到後提醒他去取餐區。' : '沒有點餐，報到後就完成了。'}</span></div>${note(r)}${idcheck(r)}`);
      current = r; setGo('確認報到', 'user-check', true); feedback('ok'); return;
    }
    if (m === 'pickup') {
      const mine = (r.items || []).filter(i => !station.vendor || i.vendor === station.vendor);
      const left = vendorsLeft(r).filter(v => !station.vendor || v === station.vendor);
      if (!mine.length) { setPanel('warn', `<div class="state">${icon('store')}這一站沒有他的餐點</div>${head(r)}${itemsHtml(r.items, station.vendor)}${note(r)}`); setGo('不用交付', 'ban', false); feedback('warn'); log('warn', r.name + ' 不是這一站'); return; }
      if (!left.length) { setPanel('warn', `<div class="state">${icon('triangle-alert')}這一站已經取過了</div>${head(r)}${itemsHtml(r.items, station.vendor)}<div class="hint">${icon('ban')}<span>請不要重複交付；有疑問請找管理員。</span></div>${note(r)}`); setGo('已取過', 'check', false); feedback('warn'); log('warn', r.name + ' 重複取餐'); return; }
      setPanel('ok', `<div class="state">${icon('hand-platter')}請交付這些餐點</div>${head(r)}${itemsHtml(r.items, station.vendor)}${!r.checked_in_at ? `<div class="hint">${icon('triangle-alert')}<span>他還沒報到。可以先交餐，但請提醒他去報到站。</span></div>` : ''}${note(r)}${idcheck(r)}`);
      current = r; setGo('確認已交付', 'package-check', true); feedback('ok'); return;
    }
    if (r.status === 'picked_up') { setPanel('warn', `<div class="state">${icon('triangle-alert')}已經完成過了</div>${head(r)}<div class="hint">${icon('clock')}<span>${esc(fmtTime(r.picked_up_at))} 已完成報到和取餐。</span></div>${itemsHtml(r.items)}${note(r)}`); setGo('已完成過', 'check', false); feedback('warn'); log('warn', r.name + ' 重複'); return; }
    setPanel('ok', `<div class="state">${icon('circle-check')}可以報到並取餐</div>${head(r)}${itemsHtml(r.items)}${note(r)}${idcheck(r)}`);
    current = r; setGo('確認交付（報到＋取餐）', 'package-check', true); feedback('ok');
  }
  function showError(msg){
    setPanel('bad', `<div class="state">${icon('wifi-off')}沒有完成</div><div class="who" style="font-size:22px">${esc(msg)}</div><div class="hint">${icon('refresh-cw')}<span>確認網路後再掃一次。</span></div>`);
    setGo('再掃一次', null, false); feedback('bad');
    if (/登入/.test(msg)) showLogin(msg);
  }

  async function onCode(raw, src){
    const code = String(raw || '').trim();
    if (!code || busy || !station) return;
    const now = Date.now();
    if (src === 'cam' && code === lastCode && now - lastAt < 4000) return;
    lastCode = code; lastAt = now; busy = true; closeSheets();
    try { show(await Api.rpc('staff_lookup', { p_code: code })); }
    catch (e) { showError(e.message); }
    finally { busy = false; }
  }

  $('goBtn').onclick = async () => {
    if (!current) return;
    if (current._find) return openSheet('findSheet');
    const r = current, m = station.mode, g = $('goBtn');
    g.disabled = true; g.innerHTML = icon('loader-circle', 'spin') + '處理中…';
    try {
      const res = m === 'checkin' ? await Api.rpc('staff_check_in', { p_reg: r.id })
                : m === 'pickup' ? await Api.rpc('staff_pickup', { p_reg: r.id, p_vendor: station.vendor })
                : await Api.rpc('staff_confirm_pickup', { p_reg: r.id });
      if (!res.ok) { show({ found: true, ...res }); return; }
      const what = m === 'checkin' ? '已報到' : m === 'pickup' ? '已交付餐點' : '已報到並取餐';
      const left = vendorsLeft(res);
      const more = m === 'checkin' && (res.items || []).length ? `<div class="hint">${icon('utensils-crossed')}<span>請提醒他到取餐區取餐。</span></div>`
                 : m === 'pickup' && left.length ? `<div class="hint">${icon('store')}<span>還有別家店的餐點沒取：${esc(left.join('、'))}</span></div>` : '';
      setPanel('done', `<div class="state">${icon('check-check')}${what}</div><div class="who">${esc(res.name)}</div>${more}<p style="opacity:.8;margin:12px 0 0">可以掃下一位了。</p>`, 5000);
      setGo('請掃描下一位', null, false); feedback('ok'); log('ok', res.name + ' ' + what); current = null;
    } catch (e) { showError(e.message); }
  };

  // ---------- 抽屜 ----------
  function openSheet(id){ closeSheets(); $('scrim').classList.add('on'); $(id).classList.add('on'); if (id === 'findSheet') setTimeout(() => $('q').focus(), 200); }
  function closeSheets(){ $('scrim').classList.remove('on'); document.querySelectorAll('.sheet.on').forEach(s => s.classList.remove('on')); }
  $('scrim').onclick = closeSheets;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
  $('findBtn').onclick = () => openSheet('findSheet');
  $('menuBtn').onclick = () => openSheet('menuSheet');
  $('searchForm').onsubmit = async e => {
    e.preventDefault(); const q = $('q').value.trim(); if (q.length < 2) return;
    if (/^[0-9]{9,11}$/.test(q) || /^XCQR-/i.test(q)) { $('q').value = ''; $('q').blur(); return onCode(q, 'manual'); }
    $('results').innerHTML = `<li style="color:var(--dim)">查詢中…</li>`;
    try {
      const rows = await Api.rpc('staff_search', { p_q: q });
      $('results').innerHTML = rows.length ? rows.map((r, i) => `<li><button type="button" data-i="${i}"><b>${esc(r.name)}</b><span class="st">${esc(STATUS_TEXT[r.status])}</span><small>${esc(r.student_id || '校外人士')}・${esc(r.order_no)}・手機末三碼 ${esc(r.phone_tail)}</small></button></li>`).join('') : `<li style="color:var(--dim)">找不到符合「${esc(q)}」的報名</li>`;
      $('results').onclick = ev => { const b = ev.target.closest('[data-i]'); if (b) { closeSheets(); $('q').value = ''; $('results').innerHTML = ''; show({ found: true, ...rows[+b.dataset.i] }); } };
    } catch (err) { $('results').innerHTML = `<li style="color:#FF9C95">${esc(err.message)}</li>`; }
  };

  // ---------- 設定 ----------
  ['Cam', 'Sound', 'Vibe'].forEach(k => { const el = $('opt' + k); el.checked = pref(k); el.onchange = () => { setPref(k, el.checked); if (k === 'Cam') { if (el.checked) startCamera(); else { stopCamera(); camMsg('camera-off', '鏡頭已關閉，條碼槍和查詢仍可使用。'); } } }; });
  $('mOut').onclick = async () => { closeSheets(); stopCamera(); await Api.logout(); showLogin(); };
  let deferred = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  async function install(){
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; return; }
    openSheet('iosSheet');
    if (!isIOS) $('iosSheet').querySelector('.steps').innerHTML = '<li>打開瀏覽器右上角的選單（⋮）</li><li>點「安裝應用程式」或「加到主畫面」</li><li>按「安裝」</li>';
  }
  $('mInstall').onclick = install; $('iosOk').onclick = closeSheets;

  // ---------- 連線狀態 ----------
  function net(){ $('net').classList.toggle('off', !navigator.onLine); $('net').textContent = navigator.onLine ? '連線正常' : '離線中'; }
  addEventListener('online', net); addEventListener('offline', net); net();

  boot();
})();
</script>
</body>
</html>
