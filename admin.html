<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>管理後台｜聖誕露天電影院</title>
<meta name="theme-color" content="#00382A">
<link rel="manifest" href="admin.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電影院後台">
<link rel="apple-touch-icon" href="icons/admin-apple-180.png">
<link rel="icon" href="icons/admin-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --rail:#00382A; --rail2:#0B4A39; --railink:#E7EFE9; --raildim:#9FB8AD;
  --bg:#F5F2EA; --surface:#FFFFFF; --sunk:#FAF8F3; --rule:#E7E1D3; --rule2:#D9D2C1;
  --ink:#182026; --ink2:#4B5359; --dim:#737B80;
  --green:#004E3B; --green2:#009B7A; --red:#D9141A; --gold:#B18B35;
  --ok-bg:#E3F2EA; --ok:#0B6B47; --caution-bg:#FCF0D4; --caution:#7A4F00; --crit-bg:#FCE6E5; --crit:#A3141A; --info-bg:#E2EEF0; --info:#0D5560; --neu-bg:#EEEBE3; --neu:#5A5F63;
  --r:10px; --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --num:"Inter","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;flex:none;vertical-align:-4px}
.muted{color:var(--dim)}.small{font-size:13px}
:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 版面 ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--railink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand img{width:36px;height:36px;border-radius:9px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--raildim);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--raildim);cursor:pointer;text-align:left;font-size:15px;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--railink)}
.nav button[aria-current="page"]{background:var(--railink);color:var(--rail);font-weight:700}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--num)}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:10px 4px}
.who{padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--raildim);display:grid;gap:8px}
.who b{display:block;color:var(--railink);font-weight:500;word-break:break-all}
.railbtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:none;color:var(--railink);border-radius:9px;min-height:36px;padding:0 10px;cursor:pointer;font-size:13px}
.railbtn:hover{background:rgba(255,255,255,.06)}
.main{min-width:0}
.tape{display:flex;align-items:center;gap:12px;padding:10px 28px;background:repeating-linear-gradient(-45deg,#FCE6E5 0 14px,#FFF6F5 14px 28px);border-bottom:1px solid #F1C6C4;color:var(--crit);font-size:14px}
.tape b{font-weight:700}
.tape button{margin-left:auto}
.top{display:flex;align-items:flex-end;gap:16px;padding:26px 28px 6px}
.top h1{font-size:26px;font-weight:900;margin:0;line-height:1.2}
.top p{margin:4px 0 0;color:var(--dim)}
.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.page{padding:18px 28px 64px;max-width:1280px}

/* ---------- 元件 ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px;margin-bottom:16px}
.card > h2{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card > h2 + p{margin:0 0 14px;color:var(--dim);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--green);background:var(--green);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .12s,transform .1s}
.btn:hover{background:#003B2D}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--rule2)}
.btn.sec:hover{background:var(--sunk)}
.btn.danger{background:var(--crit);border-color:var(--crit)}
.btn.quiet{background:none;border-color:transparent;color:var(--green)}
.btn.quiet:hover{background:rgba(0,78,59,.06)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.6}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-caution{background:var(--caution-bg);color:var(--caution)}.b-crit{background:var(--crit-bg);color:var(--crit)}.b-info{background:var(--info-bg);color:var(--info)}.b-neu{background:var(--neu-bg);color:var(--neu)}
.badge.flat::before{display:none}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.field small{display:block;color:var(--dim);font-size:12.5px;margin-top:4px}
.in,.field input,.field select,.field textarea{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--rule2);border-radius:9px;background:#fff}
.field textarea{min-height:96px;resize:vertical}
.in:focus,.field :is(input,select,textarea):focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(0,155,122,.15)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--neu-bg);border-radius:11px}
.seg button{border:0;background:none;border-radius:8px;min-height:32px;padding:0 12px;cursor:pointer;color:var(--ink2);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(24,32,38,.12)}
.seg .c{font-family:var(--num);font-size:12px;color:var(--dim)}
.searchbox{position:relative}
.searchbox .i{position:absolute;left:11px;top:11px;color:var(--dim)}
.searchbox input{padding-left:36px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;font-size:14px;margin-bottom:14px}
.note .i{margin-top:1px}
.note.caution{background:var(--caution-bg);color:#5C3B00}.note.info{background:var(--info-bg);color:#0A444C}.note.crit{background:var(--crit-bg);color:#7E0F14}
.empty{text-align:center;padding:36px 16px;color:var(--dim)}
.empty .i{width:36px;height:36px;color:var(--rule2);display:block;margin:0 auto 8px}

/* 表格 */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:12.5px;font-weight:500;color:var(--dim);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;z-index:1}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer;transition:background .1s}
.photo{display:flex;align-items:center;gap:6px}
.photo .pv{width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--dim)}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo label.btn{cursor:pointer;white-space:nowrap}.photo label.busy{opacity:.6;pointer-events:none}
.tbl .selc{width:44px;padding:0 0 0 12px}
.tbl .selc input{width:20px;height:20px;accent-color:var(--green,#004E3B);cursor:pointer;vertical-align:middle}
.tbl tr.picked td{background:#EEF5F1}
.bulkbar{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-bottom:12px;border-radius:12px;background:var(--ink,#182026);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.bulkbar b{margin-right:4px}.bulkbar .grow{flex:1}
.bulkbar .btn.sec{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.bulkbar .btn.sec:hover{background:rgba(255,255,255,.2)}
.tbl tr.click:hover td{background:#FBF8F0}
.tbl .r{text-align:right}
.tblwrap{border:1px solid var(--rule);border-radius:12px;overflow:auto;background:#fff;max-height:70vh}
.namecell b{font-weight:700}
.namecell .tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.mini{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:5px;background:var(--neu-bg);color:var(--neu)}
.mini .i{width:12px;height:12px}
.mini.test{background:#FCE6E5;color:var(--crit)}
.mini.guest{background:var(--info-bg);color:var(--info)}
.prog{display:flex;gap:4px}
.prog span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--neu-bg);color:#B5B0A3}
.prog span.on{background:var(--ok-bg);color:var(--ok)}
.prog .i{width:14px;height:14px}

/* 總覽 */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .k{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:13.5px}
.kpi .k .i{color:var(--green2)}
.kpi .v{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.2;margin-top:6px;letter-spacing:-.01em}
.kpi .v small{font-size:14px;color:var(--dim);font-weight:500;margin-left:4px}
.bar{height:6px;border-radius:9px;background:var(--neu-bg);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green2);border-radius:9px;transition:width .5s}
.todo{display:grid;gap:8px}
.todo button{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:#fff;cursor:pointer;transition:border-color .12s}
.todo button:hover{border-color:var(--green2)}
.todo button:disabled{opacity:.5;cursor:not-allowed;border-color:var(--rule)}
.todo .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.todo .ic.crit{background:var(--crit-bg);color:var(--crit)}.todo .ic.caution{background:var(--caution-bg);color:var(--caution)}.todo .ic.info{background:var(--info-bg);color:var(--info)}
.todo b{display:block}
.todo small{color:var(--dim)}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.prep h3{font-size:14px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.prep h3:first-child{margin-top:0}
.prep .it{display:grid;grid-template-columns:1fr 60px 60px 60px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--rule)}
.prep .it .num{text-align:right}
.prep .hd{font-size:12px;color:var(--dim);border:0}

/* 抽屜 */
.scrim{position:fixed;inset:0;background:rgba(24,32,38,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-18px 0 50px rgba(24,32,38,.18)}
.drawer.on{transform:none}
.dhead{padding:18px 22px 14px;background:#fff;border-bottom:1px solid var(--rule)}
.dhead .row{align-items:flex-start}
.dhead h2{margin:0;font-size:22px;font-weight:900}
.dhead .sub{color:var(--dim);font-size:13.5px;margin-top:2px}
.dbody{padding:16px 22px 40px;overflow:auto;flex:1}
.dbody .card{padding:16px 18px}
.dbody .card > h2{font-size:15px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.timeline div{position:relative;padding-top:12px;font-size:12.5px;color:var(--dim)}
.timeline div::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:9px;background:var(--neu-bg)}
.timeline div.on{color:var(--ink)}
.timeline div.on::before{background:var(--green2)}
.timeline b{display:block;font-weight:700;font-size:13px}
.money{display:flex;gap:18px;margin-top:12px}
.money div{font-size:13px;color:var(--dim)}
.money b{display:block;font-family:var(--num);font-size:20px;color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule2);border-radius:9px;overflow:hidden;background:#fff}
.stepper button{width:34px;height:34px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.stepper button:hover{background:var(--sunk)}
.stepper output{min-width:30px;text-align:center;font-family:var(--num);font-weight:700}
.ied{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule)}
.ied:last-child{border-bottom:0}

/* 對話框與通知 */
.dialog{position:fixed;inset:0;display:grid;place-items:center;z-index:60;padding:16px;background:rgba(24,32,38,.42);opacity:0;pointer-events:none;transition:opacity .15s}
.dialog.on{opacity:1;pointer-events:auto}
.dialog .box{background:#fff;border-radius:16px;width:min(440px,100%);padding:22px;box-shadow:0 24px 60px rgba(24,32,38,.25);transform:translateY(8px);transition:transform .15s}
.dialog.on .box{transform:none}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog p{margin:0 0 14px;color:var(--ink2);white-space:pre-line}
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:70;max-width:min(380px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff;box-shadow:0 10px 30px rgba(24,32,38,.25);font-size:14px;animation:tin .2s ease-out}
.toast.ok .i{color:#6BE0B2}.toast.err .i{color:#FF9C95}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
pre.mail{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--rule);border-radius:10px;padding:12px;font:inherit;font-size:14px;max-height:360px;overflow:auto;margin:8px 0 0}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.vars button{border:1px solid var(--rule2);background:var(--sunk);border-radius:7px;padding:2px 8px;font-size:12.5px;cursor:pointer}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--rule2);border-radius:14px;padding:26px 18px;text-align:center;background:var(--sunk);cursor:pointer;transition:border-color .12s,background .12s}
.drop.slim{flex-direction:row;justify-content:center;gap:10px;padding:12px 16px}.drop.slim b{margin:0}.drop.slim .i{width:22px;height:22px}
.imp{margin-top:16px;border-top:1px solid var(--rule);padding-top:16px}
.imphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.imphead b{font-size:15.5px;word-break:break-all}.imphead .small{color:var(--dim)}
.checks{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:14px;line-height:1.5}
.checks li .i{flex:none;margin-top:2px;width:18px;height:18px}.checks li span{color:var(--dim);display:block;font-size:13px}
.checks .ok{background:var(--ok-bg)}.checks .ok .i,.checks .ok b{color:var(--ok)}
.checks .warn{background:var(--caution-bg)}.checks .warn .i,.checks .warn b{color:var(--caution)}
.checks .bad{background:var(--crit-bg)}.checks .bad .i,.checks .bad b{color:var(--crit)}
.checks .neu{background:var(--sunk);border:1px solid var(--rule)}.checks .neu .i{color:var(--dim)}
.imptbl td{vertical-align:top}.imptbl td:nth-child(5){min-width:200px}.imptbl td:nth-child(6){min-width:150px}.imptbl .why{font-size:12.5px;color:var(--dim);margin-top:3px}
.impfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}.impfoot .grow{flex:1;min-width:200px;font-size:13px;color:var(--dim)}
details.impmore{margin-top:10px}details.impmore summary{cursor:pointer;font-size:13.5px;color:var(--dim);padding:4px 0}
.drop.over,.drop:hover{border-color:var(--green2);background:#F0F7F3}
.drop .i{width:32px;height:32px;color:var(--green2)}
.drop b{display:block;margin-top:8px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qrs figure{margin:0;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px;text-align:center}
.qrs svg{width:100%;height:auto;display:block}
.qrs figcaption{font-size:13px;margin-top:6px}
.switch{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--rule);background:var(--sunk);cursor:pointer}
.switch input{display:none}
.switch .sw{width:48px;height:28px;border-radius:99px;background:#CFC8B8;position:relative;flex:none;transition:background .15s}
.switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked + .sw{background:var(--crit)}
.switch input:checked + .sw::after{transform:translateX(20px)}
.switch b{display:block}
.switch small{color:var(--dim)}
.savebar{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;padding:12px 0;background:linear-gradient(to top,var(--bg) 70%,rgba(245,242,234,0))}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(400px,100%);padding:28px}
.login img{width:48px;height:48px;border-radius:12px;margin-bottom:14px}
.login h1{font-size:22px;margin:0 0 4px}

@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;padding:8px 10px;z-index:20;gap:6px;min-width:0;max-width:100vw}
  .shell > *{min-width:0}
  .brand{padding:0 6px 0 0}.brand div{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav button{white-space:nowrap;min-height:38px;padding:0 10px;width:auto}
  .nav hr,.who{display:none}
  .top{padding:18px 16px 4px;flex-wrap:wrap}.page{padding:14px 16px 64px}.tape{padding:10px 16px}
  .cols{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,1fr)}
}

/* ---------- 第二版：訂單篩選、手機卡片、明細摘要、上線檢查 ---------- */

.editbox{margin-top:12px}

.log li .small{grid-column:2;color:var(--ink2)}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700}

.check{display:grid;gap:6px}

<body>
<div id="loginView" class="login hidden">
  <div class="card">
    <img src="icons/admin-192.png" alt="">
    <h1>管理後台</h1>
    <p class="muted" style="margin:0 0 20px">聖誕露天電影院・管理員登入</p>
    <form id="loginForm">
      <label class="field"><span>Email</span><input type="email" id="lEmail" autocomplete="username" required></label>
      <label class="field"><span>密碼</span><input type="password" id="lPass" autocomplete="current-password" required></label>
      <label class="row small" style="margin:-4px 0 14px;color:var(--ink2)"><input type="checkbox" id="lRemember">記住這台裝置（自己的電腦才勾）</label>
      <p class="small" id="lErr" style="color:var(--crit);min-height:20px;margin:0 0 6px" role="alert"></p>
      <button class="btn" type="submit" id="lBtn" style="width:100%;min-height:46px">登入</button>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="rail">
    <div class="brand"><img src="icons/admin-64.png" alt=""><div><b>聖誕露天電影院</b><small>管理後台</small></div></div>
    <nav class="nav" id="nav" aria-label="後台頁面"></nav>
    <div class="who">
      <span>登入身分<b id="whoEmail"></b></span>
      <div class="row">
        <button class="railbtn" id="installBtn" type="button" title="加到主畫面或安裝成 App"></button>
        <button class="railbtn" id="outBtn" type="button"></button>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="tape hidden" id="tape"></div>
    <header class="top"><div><h1 id="pageTitle"></h1><p id="pageSub"></p></div><div class="acts" id="pageActs"></div></header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>
<div class="dialog" id="dialog" role="alertdialog" aria-modal="true"><div class="box" id="dialogBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/icons.js?v=20261120f"></script>
<script src="assets/api.js?v=20261120f"></script>
<script>
(function(){
  Api.storeKey = 'xc_admin_session';
  if (window.registerSW) registerSW();
  const $ = id => document.getElementById(id);
  let regs = [], menu = { vendors: [], items: [] }, settings = null, dash = null, view = 'dash';
  let lastLoad = 0, lastImport = null, pageDirty = false;  // 資料抓取時間、最後一次匯入郵局明細、這一頁是否有未儲存的修改
  const PAGES = [
    ['dash', '總覽', 'layout-dashboard', '報名、付款與現場進度一眼看完'],
    ['orders', '訂單', 'receipt-text', '查詢、修改餐點、人工入帳、取消'],
    ['recon', '對帳', 'landmark', '匯入郵局明細，處理對不上的款項'],
    ['mail', '信件', 'mail', '核准寄出、修改信件範本'],
    ['menu', '菜單', 'utensils-crossed', '店家、品項、價格、限量與上下架'],
    ['copy', '首頁文案', 'pencil', '報名頁上的標題、說明、步驟和常見問題'],
    ['settings', '設定', 'settings', '活動資訊、報名時間、收款帳號'],
    ['staff', '工作人員', 'users', '誰可以登入後台和掃描頁'],
    ['test', '測試工具', 'flask-conical', '不用轉帳就能把整個流程跑一遍'],
  ];

  // ---------- 通知與對話框（取代瀏覽器的 alert／confirm／prompt） ----------
  function toast(msg, tone = 'ok'){
    const t = document.createElement('div'); t.className = 'toast ' + tone;
    t.innerHTML = icon(tone === 'err' ? 'circle-alert' : 'circle-check') + `<span>${esc(msg)}</span>`;
    $('toasts').appendChild(t); setTimeout(() => t.remove(), tone === 'err' ? 6000 : 3200);
  }
  function ask({ title, body = '', input = null, ok = '確定', danger = false, cancel = '取消' }){
    return new Promise(res => {
      $('dialogBox').innerHTML = `<h3>${esc(title)}</h3>${body ? `<p>${esc(body)}</p>` : ''}${input ? `<label class="field"><span>${esc(input.label)}</span>${input.type === 'datetime-local' ? `<input id="dlgIn" type="datetime-local">` : `<input id="dlgIn" placeholder="${esc(input.placeholder || '')}">`}</label>` : ''}
        <div class="row" style="justify-content:flex-end"><button class="btn sec" type="button" data-a="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : ''}" type="button" data-a="1">${esc(ok)}</button></div>`;
      $('dialog').classList.add('on');
      const inp = $('dlgIn'); setTimeout(() => (inp || $('dialogBox').querySelector('[data-a="1"]')).focus(), 50);
      const done = v => { $('dialog').classList.remove('on'); document.removeEventListener('keydown', key); res(v); };
      const key = e => { if (e.key === 'Escape') done(null); if (e.key === 'Enter' && inp && document.activeElement === inp) $('dialogBox').querySelector('[data-a="1"]').click(); };
      document.addEventListener('keydown', key);
      $('dialogBox').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
        if (b.dataset.a === '0') return done(null);
        if (inp) { const v = inp.value.trim(); if (!v) { inp.focus(); inp.style.borderColor = 'var(--crit)'; return; } return done(v); }
        done(true); };
    });
  }
  async function run(fn, okMsg){
    try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
    catch (e) { toast(e.message, 'err'); if (!Api.session) showLogin(e.message); throw e; }
  }
  async function busy(btn, fn){ const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = icon('loader-circle', 'spin') + '處理中…'; try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; } }
  function toLocalInput(iso){ if (!iso) return ''; return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)).replace(' ', 'T'); }
  function fromLocalInput(v){ return v ? new Date(v + ':00+08:00').toISOString() : null; }
  const overdue = r => r.status === 'pending_payment' && new Date(r.payment_deadline) < new Date();
  const ST_TONE = { pending_payment: 'caution', paid: 'info', picked_up: 'ok', cancelled: 'neu' };
  const stBadge = r => overdue(r) ? '<span class="badge b-crit">逾期未付</span>' : `<span class="badge b-${ST_TONE[r.status]}">${STATUS_TEXT[r.status]}</span>`;

  // ---------- 登入 ----------
  async function boot(){
    Api.loadSession();
    if (!Api.session) return showLogin();
    try { const ok = await Api.rpc('is_admin'); if (!ok) throw new Error('這個帳號不是管理員'); }
    catch (e) { await Api.logout(); return showLogin(e.message); }
    $('loginView').classList.add('hidden'); $('app').classList.remove('hidden');
    $('whoEmail').textContent = (Api.session.user && Api.session.user.email) || '';
    buildNav(); await loadAll(); show(location.hash.slice(1) || 'dash');
  }
  function showLogin(m){ $('app').classList.add('hidden'); $('loginView').classList.remove('hidden'); $('lErr').textContent = m || ''; }
  $('loginForm').onsubmit = async e => {
    e.preventDefault(); Api.remember = $('lRemember').checked;
    await busy($('lBtn'), async () => { try { await Api.login($('lEmail').value.trim(), $('lPass').value); $('lPass').value = ''; await boot(); } catch (err) { $('lErr').textContent = /Invalid login/i.test(err.message) ? 'Email 或密碼不正確' : '登入失敗：' + err.message; } });
  };
  function buildNav(){
    $('nav').innerHTML = PAGES.map(([k, n, ic], i) => `${i === 7 ? '<hr>' : ''}<button type="button" data-v="${k}">${icon(ic)}<span>${n}</span><span class="cnt hidden" id="cnt_${k}"></span></button>`).join('');
    $('outBtn').innerHTML = icon('log-out') + '登出'; $('installBtn').innerHTML = icon('square-plus') + '安裝';
  }
  $('outBtn').onclick = async () => { await Api.logout(); showLogin(); };
  // 「首頁文案」「設定」「菜單」「信件範本」改到一半換頁會不見，先確認
  async function go(v){
    if (v !== view && pageDirty && !(await ask({ title: '這一頁還有修改沒儲存', body: '離開後，剛剛改的內容會不見。', ok: '離開，不儲存', danger: true, cancel: '留在這一頁' }))) {
      if (location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view); return;
    }
    pageDirty = false; show(v);
  }
  $('nav').onclick = e => { const b = e.target.closest('[data-v]'); if (b) go(b.dataset.v); };
  addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== view && $('app').offsetParent !== null) go(v); });
  $('page').addEventListener('input', e => { if (['copy', 'settings', 'menu', 'mail'].includes(view) && !e.target.closest('[data-q], #mAll, #oq, #newV')) pageDirty = true; });
  $('page').addEventListener('change', e => { if (['copy', 'settings', 'menu', 'mail'].includes(view) && e.target.matches('input[type=file], input[type=checkbox][data-vf], input[type=checkbox][data-if], input[type=date], input[type=datetime-local], select')) pageDirty = true; });
  addEventListener('beforeunload', e => { if (pageDirty) { e.preventDefault(); e.returnValue = ''; } });
  let deferred = null; addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  $('installBtn').onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; return; } await ask({ title: '安裝成 App', body: /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone／iPad：用 Safari 打開，點「分享」→「加入主畫面」。' : '電腦版 Chrome／Edge：點網址列右邊的「安裝」圖示。\n手機 Chrome：右上角選單 →「安裝應用程式」。', ok: '知道了', cancel: '關閉' }); };

  async function loadAll(){
    const [r, v, i, s, ib] = await Promise.all([
      Api.select('registrations', 'select=*,order_items(*),pickups(*)&order=created_at.desc'),
      Api.select('vendors', 'select=*&order=sort,name'),
      Api.select('menu_items', 'select=*&order=sort,name'),
      Api.select('settings', 'select=*&id=eq.1'),
      Api.select('import_batches', 'select=created_at&order=created_at.desc&limit=1').catch(() => [])
    ]);
    regs = r; menu = { vendors: v, items: i }; settings = s[0]; lastImport = ib[0] ? ib[0].created_at : null; lastLoad = Date.now();
    try { dash = await Api.rpc('admin_dashboard'); } catch (e) { dash = null; }
    paintChrome();
  }
  function paintChrome(){
    const setCnt = (k, n) => { const el = $('cnt_' + k); if (!el) return; el.textContent = n; el.classList.toggle('hidden', !n); };
    if (dash) { setCnt('recon', dash.txn_review); setCnt('mail', dash.email_pending + dash.email_blocked); }
    setCnt('orders', regs.filter(overdue).length);
    const tests = regs.filter(r => r.is_test).length;
    $('tape').classList.toggle('hidden', !settings.test_mode && !tests);
    $('tape').innerHTML = settings.test_mode
      ? `${icon('flask-conical')}<span><b>測試模式開啟中</b>：報名不受開放時間限制，付款頁可以模擬付款。目前有 ${tests} 筆測試資料。</span><button class="btn sm sec" type="button" data-go="test">測試工具</button>`
      : `${icon('triangle-alert')}<span>測試模式已關閉，但還有 <b>${tests}</b> 筆測試資料，正式開放前請清除。</span><button class="btn sm sec" type="button" data-go="test">去清除</button>`;
  }
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); } });

  function show(v){
    if (!PAGES.find(p => p[0] === v)) v = 'dash';
    view = v; if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
    document.querySelectorAll('#nav [data-v]').forEach(b => { if (b.dataset.v === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    const p = PAGES.find(x => x[0] === v); $('pageTitle').textContent = p[1]; $('pageSub').textContent = p[3]; $('pageActs').innerHTML = '';
    closeDrawer();
    ({ dash: renderDash, orders: renderOrders, recon: renderRecon, mail: renderMail, menu: renderMenu, copy: renderCopy, settings: renderSettings, staff: renderStaff, test: renderTest })[v]();
  }
  const page = () => $('page');
  function acts(html){ $('pageActs').innerHTML = html; }
  async function refresh(){ await run(loadAll); show(view); }
  const agoText = () => { const m = Math.floor((Date.now() - lastLoad) / 6e4); return m < 1 ? '資料剛更新' : `資料更新於 ${m} 分鐘前`; };
  const agoHtml = () => `<span class="ago small muted" id="updAgo" title="總覽和訂單頁每分鐘自動更新（開著訂單明細或正在輸入時會暫停）">${agoText()}</span>`;
  function paintAgo(){ const el = $('updAgo'); if (el) el.textContent = agoText(); }
  setInterval(async () => {
    paintAgo();
    if (document.hidden || $('app').classList.contains('hidden') || !['dash', 'orders'].includes(view)) return;
    if ($('drawer').classList.contains('on') || $('dialog').classList.contains('on')) return;
    const a = document.activeElement; if (a && a.matches('input, textarea, select') && page().contains(a)) return;
    if (Date.now() - lastLoad < 58e3) return;
    try { await loadAll(); const y = scrollY; (view === 'dash' ? renderDash : renderOrders)(); scrollTo(0, y); } catch (e) {}
  }, 15e3);

  // ---------- 總覽 ----------
  // 上半部：今天要處理的事；下半部：正式開放前的檢查清單。統計只算正式資料，測試資料另外標示。
  async function renderDash(){
    acts(`${agoHtml()}<button class="btn sec" type="button" id="rf">${icon('refresh-cw')}重新整理</button>`); $('rf').onclick = e => busy(e.currentTarget, refresh);
    const d = dash || {}; const cap = settings.capacity || 1;
    const real = regs.filter(r => !r.is_test && r.status !== 'cancelled'), tests = regs.filter(r => r.is_test && r.status !== 'cancelled').length;
    const k = { total: real.length, pending: real.filter(r => r.status === 'pending_payment').length, revenue: real.reduce((s, r) => s + (r.paid_amount || 0), 0), paid: real.filter(r => r.status !== 'pending_payment').length, checked: real.filter(r => r.checked_in_at || r.status === 'picked_up').length, done: real.filter(r => siteState(r) === 'done').length, guests: real.filter(r => r.participant_type === 'guest').length };
    const od = regs.filter(overdue).length;
    const todo = [];
    // 還有待付款的正式訂單，但超過 24 小時沒匯入郵局明細：逾期訂單要等期限後匯入過明細才會自動取消
    const pendReal = regs.filter(r => !r.is_test && r.status === 'pending_payment').length;
    const impH = lastImport ? (Date.now() - new Date(lastImport)) / 36e5 : null;

  async function reconClick(e){
    const tr = e.target.closest('[data-t]'); if (!tr) return;
    const b = e.target.closest('button'); if (!b) return;
    const tid = tr.dataset.t;
    try {
      if (b.dataset.ok) {
        const r = regs.find(x => x.id === b.dataset.ok);
        if (b.closest('.cands') && r && !(await ask({ title: '指定入帳', body: `把這筆款項入帳到 ${r.order_no} ${r.name}（應付 ${r.total_amount - r.paid_amount} 元、後五碼 ${r.payer_last5}）？`, ok: '入帳' }))) return;
        await run(() => Api.rpc('admin_resolve_txn', { p_txn: tid, p_reg: b.dataset.ok }), '已入帳');
      }
      else if (b.hasAttribute('data-assign')) {
        const key = tr.querySelector('[data-in]').value.trim().toUpperCase(); const r = regs.find(x => x.order_no === key || x.student_id === key);
        if (!r) return toast('找不到這筆訂單', 'err');
        if (!(await ask({ title: '指定入帳', body: `把這筆款項入帳到 ${r.order_no} ${r.name}（應付 ${r.total_amount - r.paid_amount} 元）？`, ok: '入帳' }))) return;
        await run(() => Api.rpc('admin_resolve_txn', { p_txn: tid, p_reg: r.id }), '已入帳');
      } else if (b.hasAttribute('data-ignore')) {
        const n = await ask({ title: '略過這筆款項', input: { label: '原因', placeholder: '例如：社課費、已退款' }, ok: '略過' }); if (!n) return;
        await run(() => Api.rpc('admin_ignore_txn', { p_txn: tid, p_note: n }), '已略過');
      } else return;
    } catch (er) { return; }
    await loadAll(); renderRecon();
  }

      <div class="savebar"><button class="btn" type="button" id="saveS">${icon('check')}儲存設定</button></div>`;
    $('posterUp').onchange = async e => { const f0 = e.target.files[0]; if (!f0) return; const lab = e.target.closest('label'); lab.classList.add('busy');
      try { const url = await Api.upload('poster/' + Date.now().toString(36) + '.jpg', await shrink(f0)); page().querySelector('[data-s="film_image_url"]').value = url; toast('海報已上傳，記得按「儲存設定」'); } catch (er) { toast('上傳失敗：' + er.message, 'err'); } finally { lab.classList.remove('busy'); e.target.value = ''; } };
    $('saveS').onclick = e => busy(e.currentTarget, async () => {
      const p = { event_info: buildEventInfo($('evD').value, $('evT').value, $('evP').value) }; page().querySelectorAll('[data-s]').forEach(el => { const k = el.dataset.s; p[k] = el.type === 'datetime-local' ? fromLocalInput(el.value) : el.type === 'number' ? parseInt(el.value, 10) : el.value.trim(); });
      if (p.qr_image_url === '') p.qr_image_url = null; if (p.film_image_url === '') p.film_image_url = null;
      p.updated_at = new Date().toISOString();
      await run(() => Api.patch('settings', 'id=eq.1', p), '設定已儲存'); await loadAll(); renderSettings();
    });
  }

  // ---------- 工作人員 ----------
  async function renderStaff(){
    const list = await run(() => Api.rpc('admin_list_staff'));
    page().innerHTML = `<div class="card"><h2>${icon('users')}可以登入的人</h2><p>管理員可以用整個後台；現場人員只能用掃描頁（查詢、報到、交付），看不到完整名單，也不能改價格或訂單。</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Email</th><th>名稱</th><th>角色</th><th></th></tr></thead><tbody>
      ${list.map(s => `<tr><td>${esc(s.email)}</td><td>${esc(s.display_name || '')}</td><td><span class="badge ${s.role === 'admin' ? 'b-info' : 'b-neu'}">${s.role === 'admin' ? '管理員' : '現場人員'}</span></td><td class="r">${s.user_id === (Api.session.user || {}).id ? '<span class="small muted">（你自己）</span>' : `<button class="btn sm quiet" type="button" data-rm="${s.user_id}">移除權限</button>`}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="card"><h2>${icon('circle-plus')}加入工作人員</h2><p>先到 Supabase 後台 Authentication → Users → Add user 建立帳號（勾 Auto Confirm），再回到這裡用同一個 Email 授權。</p>
      <div class="row"><input class="in grow" id="sEmail" placeholder="Email" type="email"><input class="in" id="sName" placeholder="名稱，例如：活動部小明"><select class="in" id="sRole" style="width:auto"><option value="staff">現場人員</option><option value="admin">管理員</option></select><button class="btn" type="button" id="sAdd">授權</button></div>
      <p class="small muted" style="margin:12px 0 0">現場人員的掃描頁網址：<span class="num">${esc(location.origin + location.pathname.replace(/admin\.html$/, ''))}scan.html</span>，建議請他們打開後「加到主畫面」。</p></div>`;
    page().onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.id === 'sAdd') { await run(() => Api.rpc('admin_grant_role', { p_email: $('sEmail').value.trim(), p_role: $('sRole').value, p_name: $('sName').value.trim() }), '已授權'); return renderStaff(); }
      if (b.dataset.rm) { if (!(await ask({ title: '移除這個人的權限？', ok: '移除', danger: true, cancel: '先不要' }))) return; await run(() => Api.rpc('admin_revoke_role', { p_user: b.dataset.rm }), '已移除'); return renderStaff(); }
    };
  }

  // ---------- 測試工具 ----------
  function renderTest(){
    const tests = regs.filter(r => r.is_test);
    const paidTests = tests.filter(r => r.status === 'paid' || r.status === 'picked_up');
    const base = location.origin + location.pathname.replace(/admin\.html$/, '');
    page().innerHTML = `
      <div class="card"><h2>${icon('flask-conical')}測試模式</h2><p>開啟後：報名不受開放時間限制、付款頁會出現「模擬已付款」按鈕、這段期間建立的報名都會標成測試資料。正式開放報名前一定要關閉，並清除測試資料。</p>
        <label class="switch"><input type="checkbox" id="tm" ${settings.test_mode ? 'checked' : ''}><span class="sw"></span><span><b id="tmText">${settings.test_mode ? '測試模式開啟中' : '測試模式已關閉'}</b><small>${settings.test_mode ? '報名頁、掃描頁和後台都會顯示測試標示' : '目前是正式狀態'}</small></span></label></div>
      <div class="cols">
        <div class="card"><h2>${icon('list-checks')}一鍵工具</h2><p>需要先開啟測試模式。</p>
          <div class="todo">
            <button type="button" id="seedBtn" ${settings.test_mode ? '' : 'disabled'}><span class="ic info">${icon('users')}</span><span><b>產生 20 筆測試報名</b><small>大約一半待付款、一半已付款，含校外人士和不點餐的人</small></span>${icon('play')}</button>
            <button type="button" id="simBtn2" ${settings.test_mode ? '' : 'disabled'}><span class="ic caution">${icon('landmark')}</span><span><b>模擬一份郵局明細</b><small>待付款的測試訂單會走過四種對帳情況：附言對、後五碼對、後五碼錯一碼、金額不對</small></span>${icon('play')}</button>
            <button type="button" id="resetBtn" ${tests.length ? '' : 'disabled'}><span class="ic crit">${icon('trash-2')}</span><span><b>清除全部測試資料（${tests.length} 筆）</b><small>連同餐點、取餐紀錄、信件和模擬款項；正式資料不受影響</small></span>${icon('play')}</button>
          </div></div>
        <div class="card"><h2>${icon('monitor-smartphone')}建議的測試順序</h2>
          <ol style="margin:0;padding-left:20px;line-height:1.9">
            <li>手機打開<a href="${esc(base)}" target="_blank" rel="noopener">報名頁</a>，用自己的學號報名並點餐</li>
            <li>付款頁按「模擬已付款」，看完成畫面和 QR Code</li>
            <li>另一台裝置打開<a href="${esc(base)}scan.html" target="_blank" rel="noopener">掃描頁</a>，選「報到站」掃自己的學生證</li>
            <li>換「取餐站」再掃一次，確認會顯示要交付的餐點</li>
            <li>產生測試報名 → 模擬明細 → 到「對帳」處理建議配對</li>
            <li>用下面的 QR Code 測試校外人士報到</li>
            <li>測完按「清除全部測試資料」</li>
          </ol></div>
      </div>
      <div class="card"><h2>${icon('qr-code')}測試用報到 QR Code（${paidTests.length}）</h2><p>已付款的測試報名。用掃描頁的鏡頭直接掃這個畫面，就能測報到和取餐。</p>
        ${paidTests.length ? `<div class="qrs">${paidTests.slice(0, 24).map(r => `<figure>${qrSvg(r.qr_token)}<figcaption><b>${esc(r.name)}</b><br><span class="small muted">${r.participant_type === 'guest' ? '校外' : esc(r.student_id)}・${(r.order_items || []).length ? (r.order_items || []).length + ' 項餐點' : '沒點餐'}・${r.status === 'picked_up' ? '已完成' : r.checked_in_at ? '已報到' : '未報到'}</span></figcaption></figure>`).join('')}</div>` : `<div class="empty">${icon('qr-code')}還沒有已付款的測試報名</div>`}
      </div>`;
    $('tm').onchange = async e => {
      const on = e.target.checked;
      if (!on && tests.length && !(await ask({ title: '關閉測試模式？', body: `還有 ${tests.length} 筆測試資料。建議先清除，再關閉測試模式。`, ok: '直接關閉', cancel: '先不要' }))) { e.target.checked = true; return; }
      if (on && !(await ask({ title: '開啟測試模式？', body: '報名頁會變成任何時間都能報名，付款頁會出現「模擬已付款」。這是公開網址，正式開放報名前一定要關掉。', ok: '開啟' }))) { e.target.checked = false; return; }
      await run(() => Api.patch('settings', 'id=eq.1', { test_mode: on, updated_at: new Date().toISOString() }), on ? '測試模式已開啟' : '測試模式已關閉');
      await loadAll(); renderTest();
    };
    $('seedBtn').onclick = e => busy(e.currentTarget, async () => { const r = await run(() => Api.rpc('admin_test_seed', { p_n: 20 })); toast(`已產生 ${r.created} 筆：已付款 ${r.paid}、待付款 ${r.pending}`); await loadAll(); renderTest(); });
    $('simBtn2').onclick = e => busy(e.currentTarget, async () => { await simulate(); renderTest(); });
    $('resetBtn').onclick = async () => { if (!(await ask({ title: `清除 ${tests.length} 筆測試資料？`, body: '測試報名、餐點、報到取餐紀錄、信件和模擬款項都會刪除，不能復原。正式資料不受影響。', ok: '全部清除', danger: true, cancel: '先不要' }))) return; const r = await run(() => Api.rpc('admin_test_reset')); toast(`已清除 ${r.registrations} 筆報名、${r.txns} 筆款項`); await loadAll(); renderTest(); };
  }
  function qrSvg(t){ if (!t || !window.qrcode) return `<div class="num small">${esc(t || '')}</div>`; const q = qrcode(0, 'M'); q.addData(t); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }

  boot();
})();
</script>
</body>
</html>
